name: test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.27']
    steps:
      - name: setup
        uses: actions/setup-go@v7
        with:
          go-version: ${{matrix.go}}

      - name: checkout
        uses: actions/checkout@v7

      - name: tools
        run: go install golang.org/x/lint/golint@latest

      - name: test
        run: make
